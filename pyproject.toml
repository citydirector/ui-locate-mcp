[project]
name = "ui-locate-mcp"
version = "0.2.5"
description = "Lightweight local visual grounding engine: find on-screen elements by text and get pixel-exact coordinates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastMCP 在 mcp<2；2.x 已把包名改为 MCPServer
    "mcp>=1.10,<2",
    "numpy>=2.0",
    # 推理后端默认走 DirectML（Windows）。它走 D3D12，NVIDIA / AMD / Intel 通吃，
    # 实测速度与 CUDA 基本持平（10.26ms vs 10.80ms），但依赖只有 24MB，
    # 而 CUDA 那套光 cudnn + cublas 就 1.2GB。详见 README 的「推理后端」一节。
    #
    # 非 Windows 没有 DirectML，退回纯 CPU 版 ORT。想在 Linux 上用 CUDA 的，
    # 装 [cuda] 可选依赖（见下）。
    "onnxruntime-directml>=1.24,<1.25; sys_platform == 'win32'",
    "onnxruntime>=1.24,<1.25; sys_platform != 'win32'",
    "opencv-python-headless",
    "pillow",
    "rapidocr>=3.0",
    "httpx",
]

[project.optional-dependencies]
# CUDA 后端：比 DirectML 快几个百分点，代价是多 1.7GB 依赖，而且只有 NVIDIA 卡能用。
#
# ⚠ 不能与默认的 DirectML 版共存 —— 两个 wheel 都提供 onnxruntime 这个顶层包，
# 后装的会覆盖先装的。正确装法（scripts/bootstrap.ps1 -Cuda 已经这么做了）：
#   uv pip install --no-deps <本包>           # 只装代码，不拉 base 里的 ORT
#   uv pip install onnxruntime-gpu <cuda 运行库>
cuda = [
    "onnxruntime-gpu>=1.23,<1.24",
    "nvidia-cudnn-cu12>=9,<10",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cuda-runtime-cu12",
]
# 只有做模型转换/量化时才需要。
quantize = [
    "onnx",
    "onnxconverter-common",
]

[project.scripts]
ui-locate = "ui_locate.client:main"
ui-locate-server = "ui_locate.server:main"
ui-locate-mcp = "ui_locate.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ui_locate"]

[tool.setuptools.package-data]
ui_locate = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
